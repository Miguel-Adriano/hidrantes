<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GPS Bombeiros - Regional Leste</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-red: #D32F2F;
            --primary-blue: #1565C0;
            --success-green: #2E7D32;
            --bg-glass: rgba(255, 255, 255, 0.95);
            --shadow-soft: 0 8px 30px rgba(0,0,0,0.12);
            --shadow-hard: 0 4px 10px rgba(0,0,0,0.25);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
        }
        
        #map { height: 100%; width: 100%; z-index: 1; }

        /* --- CABEÇALHO FLUTUANTE --- */
        .header-floating {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            width: auto; max-width: 90%;
            background: var(--bg-glass);
            padding: 10px 24px;
            border-radius: 50px;
            z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .header-floating h1 {
            margin: 0; font-size: 15px; color: #333; font-weight: 700;
            display: flex; align-items: center; gap: 8px;
            white-space: nowrap;
        }

        /* --- BOTÕES DE AÇÃO (FAB) --- */
        .controles-flutuantes {
            position: absolute; bottom: 30px; right: 20px; z-index: 1000;
            display: flex; flex-direction: column; gap: 15px;
            align-items: flex-end;
            pointer-events: none;
        }

        .btn-fab {
            pointer-events: auto;
            width: 56px; height: 56px;
            border-radius: 50%; border: none;
            font-size: 24px;
            box-shadow: var(--shadow-hard);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-fab:active { transform: scale(0.92); }
        .btn-fab.gps { background: var(--primary-blue); color: white; }
        .btn-fab.cancelar { background: var(--primary-red); color: white; display: none; }

        /* --- ESTILO DOS ÍCONES PNG NO MAPA --- */
        /* Isso dá uma sombra bonita aos seus PNGs para eles "saltarem" do mapa */
        .leaflet-marker-icon {
            filter: drop-shadow(3px 5px 2px rgba(0,0,0,0.3));
            transition: transform 0.2s;
        }
        .leaflet-marker-icon:active {
            transform: scale(0.9);
        }

        /* --- ESTILIZAÇÃO DO POPUP (CARD) --- */
        .leaflet-popup-content-wrapper {
            border-radius: 16px; padding: 0; overflow: hidden;
            box-shadow: var(--shadow-soft);
        }
        .leaflet-popup-content { margin: 0 !important; width: 260px !important; }
        .leaflet-popup-tip { background: white; box-shadow: var(--shadow-soft); }
        .leaflet-container a.leaflet-popup-close-button {
            color: white; font-size: 26px; top: 8px; right: 8px; 
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); z-index: 10;
        }

        .card-popup { display: flex; flex-direction: column; }
        
        .card-header {
            position: relative; height: 150px; width: 100%;
            background-color: #eee;
            overflow: hidden;
        }
        
        .card-img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.3s;
        }
        .card-header:active .card-img { transform: scale(1.05); }

        .card-expand-hint {
            position: absolute; bottom: 10px; right: 10px;
            background: rgba(0,0,0,0.6); color: white;
            padding: 6px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
            pointer-events: none;
        }

        .card-body { padding: 16px; text-align: center; }
        
        .card-title {
            margin: 0 0 14px 0; font-size: 17px; color: #222; font-weight: 700;
        }

        .btn-rota {
            width: 100%; padding: 14px;
            background: var(--success-green); color: white;
            border: none; border-radius: 12px;
            font-weight: 700; font-size: 15px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            cursor: pointer;
        }
        .btn-rota:active { background: #1b5e20; }

        /* --- MODAL (IMAGEM EXPANDIDA) --- */
        #modalImagem {
            display: none; position: fixed; z-index: 2000;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(5px);
            flex-direction: column;
            animation: fadeIn 0.25s ease-out;
        }

        .modal-header-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 60px;
            display: flex; justify-content: flex-end; align-items: center; padding: 0 20px;
            z-index: 2001;
        }
        
        .btn-close-modal { color: white; font-size: 36px; cursor: pointer; padding: 10px; }

        .modal-content-wrapper {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 20px; width: 100%;
        }

        #imgExpandida {
            max-width: 100%; max-height: 75vh;
            border-radius: 8px; box-shadow: 0 5px 30px rgba(0,0,0,0.5);
            object-fit: contain;
        }

        .modal-actions-sheet {
            background: white;
            padding: 20px 20px 30px 20px;
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-modal-action {
            width: 100%; padding: 16px; border-radius: 14px; border: none;
            font-size: 16px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        
        .btn-go { background: var(--success-green); color: white; }
        
        /* Ocultar texto da rota */
        .leaflet-routing-container { display: none !important; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="header-floating">
        <h1>🚒 Hidrantes - Reg. Leste</h1>
    </div>

    <div class="controles-flutuantes">
        <button id="btnCancelar" class="btn-fab cancelar" onclick="cancelarRota()">✖</button>
        <button class="btn-fab gps" onclick="minhaLocalizacao()">📍</button>
    </div>

    <div id="modalImagem">
        <div class="modal-header-bar">
            <span class="btn-close-modal" onclick="fecharModal()">&times;</span>
        </div>
        <div class="modal-content-wrapper">
            <img id="imgExpandida" src="" alt="Visualização">
        </div>
        <div class="modal-actions-sheet" id="modalFooter">
            </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script>
        var map = L.map('map', { 
            zoomControl: false, 
            attributionControl: false,
            tap: true 
        }).setView([-26.24, -48.82], 14);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        var userLat, userLng, controleRota, userMarker;
        var btnCancelar = document.getElementById('btnCancelar');
        var btnGps = document.querySelector('.btn-fab.gps');

        // --- DEFINIÇÃO DOS ÍCONES (USANDO SEUS PNGs) ---
        
        var iconeHidrante = L.icon({
            iconUrl: 'hidrante.png',    // Seu arquivo PNG
            iconSize: [40, 40],         // Tamanho do ícone
            iconAnchor: [20, 40],       // Ponto que toca o mapa (centro, em baixo)
            popupAnchor: [0, -45]       // Onde abre o balão
        });

        var iconeUnidade = L.icon({
            iconUrl: 'logo_unidade_10.png', // Seu arquivo PNG da unidade
            iconSize: [50, 50],             // Um pouco maior para destaque
            iconAnchor: [25, 50],
            popupAnchor: [0, -55]
        });

        // Dados dos Locais
        var locais = [
            { nome: "Unidade 10 - Westrupp", lat: -26.2381359, lng: -48.8112366, tipo: "unidade", imagem: "unidade_foto.png" },
            { nome: "R. Jacupiranga, 873", lat: -26.239652, lng: -48.808429, tipo: "hidrante", imagem: "hidrante1.png" },
            { nome: "Estr. Timbé, 6193", lat: -26.218075, lng: -48.818592, tipo: "hidrante", imagem: "hidrante2.png" },
            { nome: "Av. Santos Dumont, 3505", lat: -26.245698, lng: -48.840077, tipo: "hidrante", imagem: "hidrante3.png" },
            { nome: "R. Tuiuti, 2411", lat: -26.251597, lng: -48.819645, tipo: "hidrante", imagem: "hidrante4.png" },
            { nome: "R. Guaíra, 1404", lat: -26.261370, lng: -48.817416, tipo: "hidrante", imagem: "hidrante5.png" }
        ];

        // Adicionando Marcadores
        locais.forEach(function(local) {
            var icone = (local.tipo === "unidade") ? iconeUnidade : iconeHidrante;
            var marker = L.marker([local.lat, local.lng], { icon: icone }).addTo(map);
            
            // Popup Estilo Card
            var popupContent = `
                <div class="card-popup">
                    <div class="card-header" onclick="abrirModal('${local.imagem}', ${local.lat}, ${local.lng})">
                        <img src="${local.imagem}" class="card-img" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1580974511757-3451711a9a6f?q=80&w=500&auto=format&fit=crop';">
                        <div class="card-expand-hint">🔍 Tocar para ampliar</div>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">${local.nome}</h3>
                        <button class="btn-rota" onclick="tracarRota(${local.lat}, ${local.lng})">
                            🚀 TRAÇAR ROTA
                        </button>
                    </div>
                </div>
            `;
            marker.bindPopup(popupContent);
        });

        // --- FUNÇÕES ---

        function abrirModal(src, lat, lng) {
            var modalImg = document.getElementById('imgExpandida');
            // Fallback para placeholder se a imagem local falhar
            modalImg.onerror = function() {
                this.src = 'https://images.unsplash.com/photo-1580974511757-3451711a9a6f?q=80&w=1200&auto=format&fit=crop';
            };
            modalImg.src = src;

            var footer = document.getElementById('modalFooter');
            footer.innerHTML = `
                <button class="btn-modal-action btn-go" onclick="tracarRota(${lat}, ${lng}); fecharModal();">
                    🚗 INICIAR ROTA
                </button>
            `;
            
            document.getElementById('modalImagem').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modalImagem').style.display = 'none';
        }

        function minhaLocalizacao() {
            if (!navigator.geolocation) return alert("Ative o GPS.");
            
            btnGps.innerHTML = '⌛'; // Indicador de carregamento
            
            navigator.geolocation.getCurrentPosition(function(pos) {
                userLat = pos.coords.latitude;
                userLng = pos.coords.longitude;

                if (userMarker) map.removeLayer(userMarker);

                userMarker = L.circleMarker([userLat, userLng], {
                    radius: 12, fillColor: "#2196F3", color: "white", weight: 3, fillOpacity: 0.9
                }).addTo(map).bindPopup("Você").openPopup();

                map.flyTo([userLat, userLng], 16, { animate: true, duration: 1.2 });
                btnGps.innerHTML = '📍';
            }, function() {
                alert("Erro ao obter GPS.");
                btnGps.innerHTML = '📍';
            }, { enableHighAccuracy: true });
        }

        function tracarRota(destLat, destLng) {
            if (!userLat) {
                alert("📍 Ative o seu GPS primeiro.");
                minhaLocalizacao();
                return;
            }
            
            if (controleRota) map.removeControl(controleRota);

            controleRota = L.Routing.control({
                waypoints: [L.latLng(userLat, userLng), L.latLng(destLat, destLng)],
                lineOptions: { 
                    styles: [{ color: '#D32F2F', opacity: 0.9, weight: 7 }] 
                },
                createMarker: function() { return null; },
                addWaypoints: false, draggableWaypoints: false, fitSelectedRoutes: true, show: false
            }).addTo(map);

            btnCancelar.style.display = 'flex';
            map.closePopup();
        }

        function cancelarRota() {
            if (controleRota) {
                map.removeControl(controleRota);
                controleRota = null;
                btnCancelar.style.display = 'none';
                if (userLat) map.flyTo([userLat, userLng], 15);
            }
        }
    </script>
</body>
</html>
