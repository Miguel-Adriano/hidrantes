<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GPS Bombeiros - Regional Leste</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-red: #D32F2F;
            --primary-blue: #1a73e8;
            --success-green: #2E7D32;
            --bg-glass: rgba(255, 255, 255, 0.95);
            --shadow-soft: 0 8px 30px rgba(0,0,0,0.12);
            --shadow-hard: 0 4px 10px rgba(0,0,0,0.25);
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            touch-action: pan-x pan-y;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            overscroll-behavior-y: none; 
            position: fixed;
        }
        
        #map { height: 100%; width: 100%; z-index: 1; }

        #custom-alert {
            display: none;
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            z-index: 5000;
            box-shadow: var(--shadow-soft);
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            pointer-events: none;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -20px); }
            15% { opacity: 1; transform: translate(-50%, 0); }
            85% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }

        .header-floating {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            width: auto; max-width: 90%;
            background: var(--bg-glass);
            padding: 10px 24px;
            border-radius: 50px;
            z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .header-floating h1 { margin: 0; font-size: 15px; color: #333; font-weight: 700; white-space: nowrap; }

        .controles-flutuantes {
            position: absolute; bottom: 30px; right: 20px; z-index: 1000;
            display: flex; flex-direction: column; gap: 15px;
            pointer-events: none;
        }

        .btn-fab {
            pointer-events: auto;
            width: 56px; height: 56px;
            border-radius: 50%; border: none;
            font-size: 24px;
            box-shadow: var(--shadow-hard);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.2s;
        }

        .btn-fab.gps { background: var(--primary-blue); color: white; }
        .btn-fab.cancelar { background: var(--primary-red); color: white; display: none; }

        .leaflet-popup-content-wrapper { border-radius: 16px; padding: 0; overflow: hidden; }
        .leaflet-popup-content { margin: 0 !important; width: 260px !important; }

        .card-popup { display: flex; flex-direction: column; }
        .card-header { height: 140px; background-color: #eee; overflow: hidden; cursor: pointer; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 15px; text-align: center; }
        .card-title { margin: 0 0 4px 0; font-size: 16px; color: #222; font-weight: 700; }
        .card-ref { margin: 0 0 8px 0; font-size: 13px; color: #666; line-height: 1.4; }
        .card-eta { color: var(--primary-blue); font-weight: 700; font-size: 13px; display: block; margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee; margin-bottom: 12px; }

        .area-botoes { display: flex; flex-direction: column; gap: 8px; }
        
        .btn-rota {
            width: 100%; padding: 12px;
            border: none; border-radius: 10px;
            font-weight: 700; font-size: 14px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            cursor: pointer;
        }
        
        .btn-interno { background: var(--success-green); color: white; }
        .btn-google { background: #fff; color: #444; border: 1px solid #ddd; }
        .btn-google img { width: 18px; }

        #modalImagem {
            display: none; position: fixed; z-index: 6000;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            align-items: center; justify-content: center;
        }
        .btn-close-modal { position: absolute; top: 20px; right: 20px; color: white; font-size: 40px; cursor: pointer; }
        #imgExpandida { max-width: 90%; max-height: 80vh; border-radius: 8px; }
        
        .leaflet-routing-container { display: none !important; }
    </style>
</head>
<body>

    <div id="custom-alert"></div>
    <div class="header-floating"><h1>🚒 Hidrantes - Reg. Leste</h1></div>

    <div class="controles-flutuantes">
        <button id="btnCancelar" class="btn-fab cancelar" onclick="cancelarRota()">✖</button>
        <button class="btn-fab gps" onclick="minhaLocalizacao()">📍</button>
    </div>

    <div id="modalImagem">
        <span class="btn-close-modal" onclick="fecharModal()">×</span>
        <img id="imgExpandida" src="">
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script>
        var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-26.24, -48.82], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

        var userLat, userLng, controleRota, userMarker;
        var btnCancelar = document.getElementById('btnCancelar');
        var btnGps = document.querySelector('.btn-fab.gps');

        var iconeHidrante = L.icon({ iconUrl: 'hidrante.png', iconSize: [25, 25], iconAnchor: [12, 25], popupAnchor: [0, -25] });
        var iconeUnidade = L.icon({ iconUrl: 'logo_unidade_10.png', iconSize: [25, 25], iconAnchor: [12, 25], popupAnchor: [0, -25] });

        var locais = [
            { nome: "Unidade 10 - Westrupp", ref: "📍 Unidade 10", lat: -26.2381359, lng: -48.8112366, tipo: "unidade", imagem: "unidade_foto.png" },
            { nome: "R. Jacupiranga, 873", ref: "📍 Agropecuária Jacupiranga", lat: -26.239652, lng: -48.808429, tipo: "hidrante", imagem: "hidrante1.png" },
            { nome: "Estr. Timbé, 6193", ref: "📍 Em frente ao posto policial", lat: -26.218075, lng: -48.818592, tipo: "hidrante", imagem: "hidrante2.png" },
            { nome: "Av. Santos Dumont, 3505", ref: "📍 Próximo ao motel Libidus", lat: -26.245698, lng: -48.840077, tipo: "hidrante", imagem: "hidrante3.png" },
            { nome: "R. Tuiuti, 2411", ref: "📍 Supermercado Cooper", lat: -26.251597, lng: -48.819645, tipo: "hidrante", imagem: "hidrante4.png" },
            { nome: "R. Guaíra, 1404", ref: "📍 Em frente ao posto", lat: -26.261370, lng: -48.817416, tipo: "hidrante", imagem: "hidrante5.png" }
        ];

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        locais.forEach(function(local) {
            var icone = (local.tipo === "unidade") ? iconeUnidade : iconeHidrante;
            var marker = L.marker([local.lat, local.lng], { icon: icone }).addTo(map);
            
            marker.on('click', function() {
                let etaInfo = "📍 Localize-se para ver tempo";
                if (userLat && userLng) {
                    const distReal = calcularDistancia(userLat, userLng, local.lat, local.lng) * 1.3;
                    const tempo = Math.round((distReal / 40) * 60);
                    etaInfo = `⏱️ Est.: <b>${tempo} min</b> (${distReal.toFixed(1)} km)`;
                }

                var popupContent = `
                    <div class="card-popup">
                        <div class="card-header" onclick="abrirModal('${local.imagem}')">
                            <img src="${local.imagem}" class="card-img" onerror="this.src='https://via.placeholder.com/260x140?text=Sem+Foto'">
                        </div>
                        <div class="card-body">
                            <h3 class="card-title">${local.nome}</h3>
                            <div class="card-ref">${local.ref}</div>
                            <span class="card-eta">${etaInfo}</span>
                            <div class="area-botoes">
                                <button class="btn-rota btn-interno" onclick="tracarRota(${local.lat}, ${local.lng})">🚀 ROTA INTERNA</button>
                                <button class="btn-rota btn-google" onclick="abrirGoogleMaps(${local.lat}, ${local.lng})">
                                    <img src="https://cdn-icons-png.flaticon.com/512/2991/2991147.png"> GOOGLE MAPS
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                marker.bindPopup(popupContent).openPopup();
            });
        });

        function minhaLocalizacao() {
            if (!navigator.geolocation) return mostrarAviso("⚠️ GPS não suportado");
            btnGps.innerHTML = '⌛';
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    userLat = pos.coords.latitude; userLng = pos.coords.longitude;
                    if (userMarker) map.removeLayer(userMarker);
                    userMarker = L.circleMarker([userLat, userLng], { radius: 10, fillColor: "#1a73e8", color: "white", weight: 3, fillOpacity: 0.9 }).addTo(map);
                    map.flyTo([userLat, userLng], 16);
                    btnGps.innerHTML = '📍';
                }, 
                function() { btnGps.innerHTML = '📍'; mostrarAviso("❌ Erro GPS"); }, 
                { enableHighAccuracy: true }
            );
        }

        function tracarRota(destLat, destLng) {
            if (!userLat) { mostrarAviso("📍 Localize-se primeiro"); minhaLocalizacao(); return; }
            if (controleRota) map.removeControl(controleRota);

            controleRota = L.Routing.control({
                waypoints: [L.latLng(userLat, userLng), L.latLng(destLat, destLng)],
                lineOptions: {
                    styles: [
                        { color: 'white', opacity: 0.8, weight: 11 },
                        { color: '#1a73e8', opacity: 0.9, weight: 7 }
                    ]
                },
                createMarker: function() { return null; },
                addWaypoints: false, 
                show: false
            }).addTo(map);

            btnCancelar.style.display = 'flex';
            map.closePopup();
        }

        function abrirGoogleMaps(destLat, destLng) {
            let url = userLat 
                ? `https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLng}&destination=${destLat},${destLng}&travelmode=driving`
                : `https://www.google.com/maps/search/?api=1&query=${destLat},${destLng}`;
            window.open(url, '_blank');
        }

        function cancelarRota() {
            if (controleRota) { map.removeControl(controleRota); controleRota = null; btnCancelar.style.display = 'none'; }
        }

        function mostrarAviso(msg) {
            const alerta = document.getElementById('custom-alert');
            alerta.innerText = msg; alerta.style.display = 'block';
            alerta.style.animation = 'none'; alerta.offsetHeight; 
            alerta.style.animation = 'fadeInOut 3s forwards';
        }

        function abrirModal(src) { document.getElementById('imgExpandida').src = src; document.getElementById('modalImagem').style.display = 'flex'; }
        function fecharModal() { document.getElementById('modalImagem').style.display = 'none'; }

        // ATIVAÇÃO AUTOMÁTICA AO CARREGAR
        window.onload = function() {
            minhaLocalizacao();
        };
    </script>
</body>
</html>
