<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GPS Bombeiros - Regional Leste</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-red: #D32F2F;
            --primary-blue: #1a73e8;
            --success-green: #2E7D32;
            --bg-glass: rgba(255, 255, 255, 0.95);
            --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.12);
            --shadow-hard: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            overscroll-behavior: none;
            position: fixed;
            left: 0;
            top: 0;
        }

        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
        }

        .header-floating {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-glass);
            padding: 10px 24px;
            border-radius: 50px;
            z-index: 1000;
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .header-floating h1 {
            margin: 0;
            font-size: 15px;
            color: #333;
            font-weight: 700;
        }

        .controles-flutuantes {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: none;
        }

        .btn-fab {
            pointer-events: auto;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            box-shadow: var(--shadow-hard);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-fab.gps {
            background: var(--primary-blue);
            color: white;
        }

        .btn-fab.cancelar {
            background: var(--primary-red);
            color: white;
            display: none;
        }

        /* Estilo do Popup */
        .leaflet-popup-content-wrapper {
            border-radius: 16px;
            padding: 0;
            overflow: hidden;
        }

        .leaflet-popup-content {
            margin: 0 !important;
            width: 260px !important;
        }

        .card-popup {
            display: flex;
            flex-direction: column;
        }

        .card-header {
            height: 140px;
            background-color: #eee;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        .card-body {
            padding: 15px;
            text-align: center;
        }

        .card-title {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 700;
        }

        .card-ref {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }

        .card-eta {
            color: var(--primary-blue);
            font-weight: 700;
            display: block;
            margin-bottom: 10px;
        }

        .area-botoes {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-rota {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-interno {
            background: var(--success-green);
            color: white;
        }

        .btn-google {
            background: #fff;
            color: #444;
            border: 1px solid #ddd;
        }

        .btn-google img {
            width: 18px;
            height: 18px;
        }

        /* Modal de Imagem Expandida */
        #modalImagem {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
        }

        #imgExpandida {
            max-width: 95%;
            max-height: 80%;
            border-radius: 8px;
        }

        .btn-close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 40px;
        }

        .leaflet-routing-container {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="header-floating">
        <h1>🚒 Hidrantes - Reg. Leste</h1>
    </div>

    <div class="controles-flutuantes">
        <button id="btnCancelar" class="btn-fab cancelar" onclick="cancelarRota()">✖</button>
        <button class="btn-fab gps" onclick="minhaLocalizacao()">📍</button>
    </div>

    <div id="modalImagem" onclick="fecharModal()">
        <span class="btn-close-modal">×</span>
        <img id="imgExpandida" src="">
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script>
        // --- BLOQUEIO DE RECARREGAMENTO APK ---
        let ts;
        document.addEventListener('touchstart', (e) => { ts = e.touches[0].clientY; }, { passive: false });
        document.addEventListener('touchmove', (e) => {
            if (window.scrollY === 0 && e.touches[0].clientY > ts) e.preventDefault();
        }, { passive: false });

        // --- CONFIG MAPA ---
        var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-26.24, -48.82], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

        var userLat, userLng, controleRota, userMarker;
        var iconeHidrante = L.icon({ iconUrl: 'hidrante.png', iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -30] });
        var iconeUnidade = L.icon({ iconUrl: 'logo_unidade_10.png', iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -30] });

        var locais = [
            { nome: "Unidade 10 - Westrupp", ref: "📍 Unidade 10", lat: -26.2381359, lng: -48.8112366, tipo: "unidade", imagem: "unidade_foto.png" },
            { nome: "R. Jacupiranga, 873", ref: "📍 Em frente a Agropecuária Jacupiranga", lat: -26.239652, lng: -48.808429, tipo: "hidrante", imagem: "hidrante1.png" },
            { nome: "Estr. Timbé, 6193", ref: "📍 Em frente ao posto policial", lat: -26.218075, lng: -48.818592, tipo: "hidrante", imagem: "hidrante2.png" },
            { nome: "Av. Santos Dumont, 3505", ref: "📍 Próximo ao motel Libidus", lat: -26.245698, lng: -48.840077, tipo: "hidrante", imagem: "hidrante3.png" },
            { nome: "R. Tuiuti, 2411", ref: "📍 Em frente ao Supermercado Cooper", lat: -26.251597, lng: -48.819645, tipo: "hidrante", imagem: "hidrante4.png" },
            { nome: "R. Guaíra, 1404", ref: "📍 Em frente ao posto", lat: -26.261370, lng: -48.817416, tipo: "hidrante", imagem: "hidrante5.png" }
        ];

        // --- FUNÇÕES DE INTERAÇÃO ---
        function abrirModal(src) {
            const m = document.getElementById('modalImagem');
            document.getElementById('imgExpandida').src = src;
            m.style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modalImagem').style.display = 'none';
        }

        function abrirGoogleMaps(lat, lng) {
            // Este formato é o link universal que o Android intercepta e pergunta: 
            // "Abrir com o Maps?" ou abre direto o app.
            const url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;

            // No APK, o window.open às vezes falha. Usar o location.href é mais seguro.
            window.location.href = url;
        }
 
        function tracarRota(lat, lng) {
            if (!userLat) { alert("Ative o GPS primeiro"); minhaLocalizacao(); return; }
            if (controleRota) map.removeControl(controleRota);

            controleRota = L.Routing.control({
                waypoints: [L.latLng(userLat, userLng), L.latLng(lat, lng)],
                lineOptions: { styles: [{ color: '#1a73e8', weight: 6 }] },
                createMarker: () => null,
                addWaypoints: false,
                show: false
            }).addTo(map);

            document.getElementById('btnCancelar').style.display = 'flex';
            map.closePopup();
        }

        function cancelarRota() {
            if (controleRota) map.removeControl(controleRota);
            document.getElementById('btnCancelar').style.display = 'none';
        }

        function minhaLocalizacao() {
            navigator.geolocation.getCurrentPosition((pos) => {
                userLat = pos.coords.latitude; userLng = pos.coords.longitude;
                if (userMarker) map.removeLayer(userMarker);
                userMarker = L.circleMarker([userLat, userLng], { radius: 8, color: 'white', fillColor: '#1a73e8', fillOpacity: 1, weight: 3 }).addTo(map);
                map.flyTo([userLat, userLng], 15);
            }, null, { enableHighAccuracy: true });
        }

        // --- RENDERIZAR MARCADORES ---
        locais.forEach(local => {
            const marker = L.marker([local.lat, local.lng], {
                icon: local.tipo === "unidade" ? iconeUnidade : iconeHidrante
            }).addTo(map);

            marker.bindPopup(() => {
                let eta = "Ative o GPS";
                if (userLat) {
                    const d = map.distance([userLat, userLng], [local.lat, local.lng]) / 1000;
                    eta = `${Math.round(d * 2)} min (${d.toFixed(1)} km)`;
                }

                return `
                <div class="card-popup">
                    <div class="card-header">
                        <img src="${local.imagem}" class="card-img" onclick="abrirModal('${local.imagem}')" onerror="this.src='https://via.placeholder.com/260x140?text=Sem+Foto'">
                    </div>
                    <div class="card-body">
                        <div class="card-title">${local.nome}</div>
                        <div class="card-ref">${local.ref}</div>
                        <div class="card-eta">⏱️ ${eta}</div>
                        <div class="area-botoes">
                            <button class="btn-rota btn-interno" onclick="tracarRota(${local.lat}, ${local.lng})">🚀 TRAÇAR ROTA</button>
                            <button class="btn-rota btn-google" onclick="abrirGoogleMaps(${local.lat}, ${local.lng})">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/3/39/Google_Maps_icon_%282015-2020%29.svg"> GOOGLE MAPS
                            </button>
                        </div>
                    </div>
                </div>`;
            });
        });

        window.onload = minhaLocalizacao;
    </script>
</body>

</html>
